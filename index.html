<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>사과데이 마음잇기 카드</title>

  <style>
    :root {
      --bg1: #fff7ed;
      --bg2: #fef3c7;
      --card: #ffffff;
      --apple: #ef4444;
      --apple-dark: #b91c1c;
      --orange: #f97316;
      --yellow: #facc15;
      --green: #16a34a;
      --border: #fdba74;
      --text: #1f2937;
      --muted: #6b7280;
      --danger: #b91c1c;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #fee2e2 0, transparent 26%),
        radial-gradient(circle at top right, #fef08a 0, transparent 24%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      margin: 0;
      padding: 0;
      word-break: keep-all;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #fed7aa;
      border-radius: 30px;
      padding: 24px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .top-area {
      display: grid;
      grid-template-columns: 1fr 150px;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--apple-dark);
      font-size: 32px;
      line-height: 1.25;
    }

    h2 {
      font-size: 21px;
      margin: 0 0 12px;
      color: var(--apple-dark);
    }

    p {
      line-height: 1.6;
    }

    .subtitle {
      margin: 0;
      color: #4b5563;
      line-height: 1.6;
      font-size: 16px;
    }

    .apple-svg {
      width: 140px;
      height: 140px;
      justify-self: center;
    }

    .section {
      background: rgba(255, 255, 255, 0.96);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      border: 2px solid #fed7aa;
    }

    .note {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #7c2d12;
      border-radius: 16px;
      padding: 14px;
      line-height: 1.6;
      font-size: 15px;
      margin-top: 14px;
    }

    .info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      border-radius: 16px;
      padding: 14px;
      line-height: 1.6;
      font-size: 15px;
      margin-top: 12px;
    }

    label {
      display: block;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--apple-dark);
      font-size: 16px;
    }

    .guide {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 8px;
      line-height: 1.5;
    }

    textarea,
    select,
    input {
      width: 100%;
      border: 2px solid #fdba74;
      border-radius: 16px;
      padding: 13px;
      font-size: 16px;
      line-height: 1.5;
      resize: vertical;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 82px;
    }

    textarea:focus,
    select:focus,
    input:focus {
      outline: 4px solid #fed7aa;
      border-color: var(--orange);
    }

    .input-block {
      background: #fff7ed;
      border: 1px dashed #fb923c;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      min-height: 52px;
    }

    .primary {
      background: var(--apple);
      color: white;
    }

    .secondary {
      background: #ffedd5;
      color: #9a3412;
      border: 2px solid #fdba74;
    }

    .green-btn {
      background: #dcfce7;
      color: #166534;
      border: 2px solid #86efac;
    }

    .ghost {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #d1d5db;
    }

    button:active {
      transform: translateY(1px);
    }

    .card {
      background:
        radial-gradient(circle at top left, #fee2e2 0, transparent 28%),
        radial-gradient(circle at bottom right, #dcfce7 0, transparent 25%),
        #ffffff;
      border: 4px solid #fb7185;
      border-radius: 30px;
      padding: 24px;
      margin-top: 16px;
      line-height: 1.8;
      font-size: 18px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      right: -30px;
      top: -30px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #fecdd3;
      opacity: 0.55;
    }

    .card-title {
      font-weight: 900;
      color: var(--apple-dark);
      margin-bottom: 14px;
      font-size: 24px;
      position: relative;
      z-index: 1;
    }

    #cardText {
      white-space: pre-line;
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 18px;
      padding: 14px;
    }

    .checklist {
      background: #fff7ed;
      border-radius: 16px;
      padding: 14px;
      line-height: 1.8;
      font-size: 15px;
      color: #444;
      border: 1px dashed #fdba74;
    }

    .score-box {
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 16px;
      padding: 14px;
      margin-top: 12px;
      line-height: 1.7;
      font-size: 15px;
    }

    .score-good {
      color: #166534;
      font-weight: 900;
    }

    .score-warn {
      color: var(--danger);
      font-weight: 900;
    }

    .small {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    .color-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .chip {
      padding: 8px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .chip.red {
      background: #fee2e2;
      color: #991b1b;
    }

    .chip.yellow {
      background: #fef9c3;
      color: #854d0e;
    }

    .chip.green {
      background: #dcfce7;
      color: #166534;
    }

    .chip.blue {
      background: #dbeafe;
      color: #1e40af;
    }

    @media (max-width: 680px) {
      .top-area {
        grid-template-columns: 1fr;
        text-align: left;
      }

      .apple-svg {
        width: 110px;
        height: 110px;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 14px;
      }

      header {
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }

      .card {
        font-size: 16px;
        padding: 18px;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header>
      <div class="top-area">
        <div>
          <h1>사과데이 마음잇기 카드</h1>
          <p class="subtitle">
            나 전달법을 활용해 상대를 존중하는 사과문을 만들어 봅시다.
            내 마음을 솔직하게 전하고, 상대의 마음도 함께 생각해 봅니다.
          </p>
        </div>

        <svg class="apple-svg" viewBox="0 0 200 200" aria-label="사과 그림" role="img">
          <ellipse cx="100" cy="112" rx="62" ry="58" fill="#ef4444"></ellipse>
          <ellipse cx="76" cy="104" rx="38" ry="48" fill="#f87171"></ellipse>
          <ellipse cx="121" cy="104" rx="38" ry="48" fill="#dc2626"></ellipse>
          <path d="M100 55 C95 35, 110 20, 128 21" fill="none" stroke="#7c2d12" stroke-width="10" stroke-linecap="round"></path>
          <path d="M125 37 C146 24, 164 33, 168 49 C147 54, 134 50, 125 37Z" fill="#22c55e"></path>
